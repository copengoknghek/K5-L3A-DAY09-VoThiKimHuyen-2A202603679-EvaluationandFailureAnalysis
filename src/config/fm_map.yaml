# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket (or injected "[SYSTEM]") overrides the DB delay_days
stale_policy: FM-06            # superseded / not-yet-effective clause used as current
clause_sum: FM-04              # sums clause parts instead of taking the applicable amount
double_deduct: FM-05           # deducts prior refunds before the host does it again
sibling_refund: FM-07          # "gom đơn": money written under sibling claims of the same order
denied_ignored: FM-02          # host/approval says no, agent still reports resolved
reply_ledger_mismatch: FM-08   # approval caps below the quote; reply must state what the ledger holds
cross_principal: FM-09         # caller acts on an order owned by another principal
